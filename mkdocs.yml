# 1. 基本信息
site_name: Useful Tools
site_description: 详细的各种电脑工具记录
site_author: Lucas
site_url: https://ldray857.github.io/CodingNote/
edit_uri: edit/main/docs/

# 2. 仓库链接（右上角会显示 GitHub 图标）
repo_name: CodingNote
repo_url: https://github.com/ldray857/CodingNote

# 3. 主题配置
theme:
  name: material
  language: zh
  favicon: assets/favicon.png # 如果有图标可以放在这里
  logo: assets/avatar.jpg
  palette: 
    # 自动切换深/浅模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo # 浙大蓝风格
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换至浅色模式
  features:
    - navigation.tabs           # 顶部一级分类
    - navigation.sections       # 侧边栏分组
    - navigation.expand         # 默认展开
    - navigation.top            # 回到顶部按钮
    - navigation.footer         # 开启底部“上一页/下一页”导航栏
    - search.suggest            # 搜索建议
    - search.highlight          # 搜索关键词高亮
    - content.code.copy         # 代码块一键复制
extra_css:
  - stylesheets/extra.css

