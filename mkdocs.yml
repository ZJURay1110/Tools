# 基本信息
site_name: Dev Tools Hub
site_description: 开发者工具分类索引与使用指南
site_author: Lucas
site_url: https://ldray857.github.io/CodingNote/
edit_uri: edit/main/docs/

# 仓库链接
repo_name: CodingNote
repo_url: https://github.com/ldray857/CodingNote

# 主题配置
theme:
  name: material
  language: zh
  favicon: assets/favicon.png
  logo: assets/avatar.jpg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

# 导航栏配置
nav:
  - 首页:
      - 门户中心: index.md

  - 代码编写:
      - 总览: ide/index.md
      - 通用 IDE: ide/gen_ide/index.md
      - 环境配置: ide/manage/index.md
      - 单语言专用 IDE: ide/lang_ide/index.md

  - 文件网络传输:
      - 总览: file_transfer/index.md
      - FTP/SFTP 客户端: file_transfer/ftp/index.md
      - 下载管理器: file_transfer/dl_mgr/index.md
      - BT 客户端: file_transfer/torrent/index.md
      - 远程同步: file_transfer/remote_sync/index.md
      - 网盘工具: file_transfer/cloud_disk/index.md

  - 文件管理:
      - 总览: file_mgr/index.md
      - 资源管理器增强: file_mgr/explorer/index.md
      - 磁盘空间分析: file_mgr/disk_scan/index.md
      - 压缩解压: file_mgr/compress/index.md
      - 同步备份: file_mgr/sync/index.md
      - 重复文件清理: file_mgr/dedup/index.md

  - 通用编辑器:
      - 总览: editor/index.md
      - 图片查看器: editor/photo/img_view/index.md
      - 图像编辑: editor/photo/img_edit/index.md
      - 截图工具: editor/photo/screen_cap/index.md
      - 屏幕录制: editor/photo/screen_rec/index.md
      - 文本编辑器: editor/text/txt_edit/index.md
      - Markdown 笔记: editor/text/md_note/index.md
      - 办公套件: editor/text/office/index.md

  - 前端开发:
      - 总览: frontend/index.md
      - 浏览器 DevTools: frontend/browser_dt/index.md
      - 包管理器: frontend/pkg_mgr/index.md
      - 构建工具: frontend/build/index.md
      - 前端框架: frontend/framework/index.md
      - UI 组件库: frontend/ui_lib/index.md
      - 代码检查: frontend/lint/index.md

  - 后端开发:
      - 总览: backend/index.md
      - API 调试客户端: backend/api/index.md
      - 关系型数据库: backend/db/sql_db/index.md
      - NoSQL 数据库: backend/db/nosql_db/index.md
      - 容器化: backend/container/index.md
      - Web 服务器: backend/web_srv/index.md
      - 消息队列: backend/mq/index.md

  - GIS 开发:
      - 总览: gis/index.md
      - 桌面 GIS: gis/desktop/index.md
      - 服务端 GIS: gis/server/index.md
      - 空间数据库: gis/spatial_db/index.md
      - Web GIS 框架: gis/webgis/index.md
      - 空间数据处理: gis/spatial_tool/index.md
      - 遥感: gis/rs/index.md

  - 开发辅助工具:
      - 总览: dev_utils/index.md
      - 版本控制: dev_utils/vcs/index.md
      - 终端模拟器: dev_utils/terminal/index.md
      - 差异对比与合并: dev_utils/diff/index.md
      - 虚拟机与环境: dev_utils/vm/index.md
      - 系统监控: dev_utils/sys_mon/index.md
      - 文档生成: dev_utils/doc/index.md

  - AI 工具:
      - 总览: ai/index.md
      - OpenAI 生态: ai/gpt/index.md
      - Google AI 生态: ai/google/index.md
      - Anthropic 生态: ai/claude/index.md
      - DeepSeek 生态: ai/deepseek/index.md
      - AI 编码代理: ai/agents/index.md
      - API 中转代理: ai/proxy/index.md

# Markdown 扩展
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

# 数学公式渲染
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
